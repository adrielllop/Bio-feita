<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, shrink-to-fit=no">
  <title>MestreXit | Painéis Grátis & Loja</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --orange: #ff7b00;
      --orange-glow: #ff9f2f;
      --dark: #080808;
      --glass-bg: rgba(10, 10, 10, 0.55);
      --border-glass: rgba(255, 140, 0, 0.35);
    }

    body {
      min-height: 100vh;
      background: #030303;
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 120, 0, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 80, 0, 0.05) 0%, transparent 50%);
    }

    /* Cartão principal com efeito vidro e borda neon */
    .glass-card {
      position: relative;
      width: 100%;
      max-width: 720px;
      border-radius: 56px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 
        0 0 0 2px var(--border-glass),
        0 25px 45px rgba(0, 0, 0, 0.9),
        0 0 80px rgba(255, 100, 0, 0.3),
        inset 0 0 50px rgba(255, 100, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      isolation: isolate;
      transition: box-shadow 0.5s ease;
    }

    .glass-card:hover {
      box-shadow: 
        0 0 0 2px rgba(255, 140, 0, 0.7),
        0 30px 60px rgba(0, 0, 0, 0.95),
        0 0 100px rgba(255, 100, 0, 0.5),
        inset 0 0 70px rgba(255, 100, 0, 0.15);
    }

    /* Imagem de fundo */
    .bg-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      z-index: 0;
      filter: brightness(0.3) contrast(1.2) saturate(0.7);
      transform: scale(1.03);
    }

    /* Camadas de sobreposição artística */
    .overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: 
        radial-gradient(ellipse at 50% 20%, rgba(255, 100, 0, 0.25) 0%, transparent 70%),
        radial-gradient(ellipse at 80% 80%, rgba(180, 60, 0, 0.2) 0%, transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.8) 100%);
      mix-blend-mode: multiply;
    }

    /* Partículas flutuantes (pseudo-elementos) */
    .particles {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-image: 
        radial-gradient(circle at 15% 25%, rgba(255, 160, 0, 0.6) 1px, transparent 1px),
        radial-gradient(circle at 85% 35%, rgba(255, 120, 0, 0.5) 1.5px, transparent 1.5px),
        radial-gradient(circle at 30% 75%, rgba(255, 180, 0, 0.45) 1px, transparent 1px),
        radial-gradient(circle at 70% 15%, rgba(255, 100, 0, 0.55) 1.2px, transparent 1.2px),
        radial-gradient(circle at 50% 60%, rgba(255, 140, 0, 0.4) 1px, transparent 1px);
      background-size: 200px 200px;
      animation: drift 18s infinite alternate ease-in-out;
    }

    @keyframes drift {
      0% { background-position: 0% 0%, 100% 10%, 20% 80%, 80% 5%, 60% 50%; opacity: 0.8; }
      100% { background-position: 5% 5%, 95% 15%, 25% 85%, 75% 0%, 55% 55%; opacity: 1; }
    }

    /* Conteúdo principal elevado */
    .content {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 45px 35px 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Logo com aura giratória */
    .logo-wrapper {
      position: relative;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-ring {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, var(--orange), transparent, var(--orange-glow), transparent);
      filter: blur(18px);
      opacity: 0.5;
      animation: spin 8s linear infinite;
      z-index: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .logo-img {
      width: 125px;
      height: auto;
      object-fit: contain;
      border-radius: 32px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 8px;
      box-shadow: 0 0 45px rgba(255, 120, 0, 0.7);
      z-index: 2;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .logo-img:hover {
      transform: scale(1.06) rotate(1deg);
    }

    /* Subtítulo com efeito neon */
    .subtitle {
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      padding: 10px 28px;
      border-radius: 50px;
      margin-bottom: 38px;
      border: 1px solid rgba(255, 140, 0, 0.55);
      text-shadow: 0 0 12px var(--orange), 0 0 30px var(--orange-glow);
      box-shadow: 0 0 18px rgba(255, 100, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .subtitle::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 200, 100, 0.3), transparent);
      transition: left 0.7s;
    }

    .subtitle:hover::after {
      left: 100%;
    }

    /* Container dos botões */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 24px;
      width: 100%;
      max-width: 340px;
      align-items: center;
    }

    /* Botão premium com borda animada */
    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
      padding: 19px 30px;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 60px;
      background: rgba(8, 8, 8, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      border: 2px solid rgba(255, 140, 0, 0.7);
      box-shadow: 0 10px 25px rgba(255, 80, 0, 0.3), 0 0 25px rgba(255, 100, 0, 0.4);
      transition: all 0.35s cubic-bezier(0.23, 1, 0.32, 1);
      overflow: hidden;
      z-index: 1;
      cursor: pointer;
    }

    /* Efeito de varredura luminosa */
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 180, 50, 0.4), transparent);
      transition: left 0.6s ease;
      z-index: -1;
    }

    .btn:hover::before {
      left: 100%;
    }

    /* Borda giratória no hover */
    .btn::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 65px;
      background: conic-gradient(from 0deg, var(--orange), #ff5500, var(--orange-glow), var(--orange), #ff5500);
      z-index: -2;
      opacity: 0;
      transition: opacity 0.3s;
      animation: rotateBorder 4s linear infinite;
      filter: blur(6px);
    }

    @keyframes rotateBorder {
      to { transform: rotate(360deg); }
    }

    .btn:hover::after {
      opacity: 0.9;
    }

    .btn:hover {
      background: #ff7b00;
      color: #000;
      border-color: #ff7b00;
      box-shadow: 0 0 45px #ff7b00, 0 20px 35px rgba(255, 80, 0, 0.8);
      transform: translateY(-5px) scale(1.02);
      font-weight: 800;
      letter-spacing: 1.8px;
    }

    .btn-icon {
      font-size: 1.6rem;
      filter: drop-shadow(0 0 8px currentColor);
      transition: transform 0.3s;
    }

    .btn:hover .btn-icon {
      transform: scale(1.2) rotate(8deg);
    }

    /* Texto de rodapé */
    .footer-tag {
      margin-top: 38px;
      color: rgba(255, 200, 120, 0.9);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 1.5px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      padding: 7px 26px;
      border-radius: 30px;
      border: 1px solid rgba(255, 140, 0, 0.5);
      text-shadow: 0 0 8px var(--orange);
      transition: 0.3s;
    }

    .footer-tag:hover {
      background: rgba(255, 100, 0, 0.2);
      border-color: var(--orange-glow);
    }

    /* Responsivo */
    @media (max-width: 500px) {
      .glass-card {
        border-radius: 40px;
      }
      .content {
        padding: 35px 20px 30px;
      }
      .logo-img {
        width: 100px;
      }
      .logo-ring {
        width: 120px;
        height: 120px;
      }
      .btn {
        padding: 16px 20px;
        font-size: 1rem;
      }
      .subtitle {
        font-size: 0.9rem;
        padding: 8px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <!-- Imagem de fundo fornecida -->
    <img 
      src="https://i.postimg.cc/gjdyjJwP/file-000000005ec0820eb1306ef86a9ed3a8.png" 
      alt="Background" 
      class="bg-image"
      loading="eager"
    >
    <div class="overlay"></div>
    <div class="particles"></div>

    <!-- Conteúdo -->
    <div class="content">
      <!-- Logo com anel de luz -->
      <div class="logo-wrapper">
        <div class="logo-ring"></div>
        <img 
          src="https://i.postimg.cc/X7LLZwcm/file-00000000779471f585f8cb023dfdc1f3.png" 
          alt="Logo MestreXit" 
          class="logo-img"
        >
      </div>

      <!-- Saudação neon -->
      <div class="subtitle">🔥 Comunidade & Loja 🔥</div>

      <!-- Botões de ação -->
      <div class="button-group">
        <!-- Botão 1: Discord Painéis Grátis -->
        <a 
          href="https://discord.gg/55BUKfz7r" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn"
        >
          <span class="btn-icon">💬</span> 
          Painéis Grátis
        </a>

        <!-- Botão 2: Loja Online -->
        <a 
          href="https://mestrexit-stor.mginex.site/" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="btn"
        >
          <span class="btn-icon">🛒</span> 
          Loja Online
        </a>
      </div>

      <!-- Rodapé sutil -->
      <div class="footer-tag">⚡ Escolha seu destino ⚡</div>
    </div>
  </div>
</body>
</html>
